[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metrobench"
version = "0.1.0"
description = "Benchmark of anomaly detection methods on the MetroPT-3 metro air compressor dataset"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmed Mimouni"}]
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
